name: LeadPilot Social Video

on:
  workflow_dispatch:
    inputs:
      campaign:
        description: LeadPilot campaign to generate
        required: true
        default: LP_MISSED_LEADS
        type: choice
        options:
          - LP_MISSED_LEADS
          - LP_FIVE_MINUTE_SETUP
          - LP_CUSTOMER_DATABASE
          - LP_TRIAL
      publish:
        description: Publish to YouTube and Facebook after generation
        required: true
        default: false
        type: boolean
      platforms:
        description: Comma-separated platforms when publishing
        required: true
        default: youtube,facebook
        type: string

jobs:
  leadpilot-video:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write

    env:
      USE_SECRET_MANAGER: 'true'
      DEFAULT_GOOGLE_CLOUD_PROJECT: natureswaysoil-video
      GOOGLE_CLOUD_PROJECT: natureswaysoil-video
      LEADPILOT_CAMPAIGN_ID: ${{ inputs.campaign }}
      LEADPILOT_PUBLISH: ${{ inputs.publish }}
      LEADPILOT_PLATFORMS: ${{ inputs.platforms }}
      LEADPILOT_URL: https://followupnest-git-feature-onboard-fc8b14-james-projects-5e9a58a0.vercel.app/
      GCS_PUBLIC_BUCKET: natureswaysoil-social-videos
      VIDEO_PUBLIC_BUCKET: natureswaysoil-social-videos
      VIDEO_PUBLIC_URL_BASE: https://storage.googleapis.com/natureswaysoil-social-videos
      LEADPILOT_YT_PRIVACY_STATUS: public

      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud OIDC
        if: env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && env.GCP_SERVICE_ACCOUNT != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ env.DEFAULT_GOOGLE_CLOUD_PROJECT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Prepare Google ADC credentials
        if: env.GOOGLE_APPLICATION_CREDENTIALS == ''
        shell: bash
        run: |
          set -euo pipefail
          CREDS_JSON="${GOOGLE_CREDENTIALS:-}"
          if [ -z "$CREDS_JSON" ]; then
            CREDS_JSON="${GOOGLE_SERVICE_ACCOUNT_JSON:-}"
          fi
          if [ -z "$CREDS_JSON" ]; then
            echo "::error::No Google auth configured. Add GCP OIDC secrets or GOOGLE_CREDENTIALS / GOOGLE_SERVICE_ACCOUNT_JSON."
            exit 1
          fi
          CREDS_PATH="$RUNNER_TEMP/gcp-service-account.json"
          printf '%s' "$CREDS_JSON" > "$CREDS_PATH"
          chmod 600 "$CREDS_PATH"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$CREDS_PATH" >> "$GITHUB_ENV"
          echo "GOOGLE_CLOUD_PROJECT=$DEFAULT_GOOGLE_CLOUD_PROJECT" >> "$GITHUB_ENV"
          echo "GCLOUD_PROJECT=$DEFAULT_GOOGLE_CLOUD_PROJECT" >> "$GITHUB_ENV"
          echo "GCP_PROJECT=$DEFAULT_GOOGLE_CLOUD_PROJECT" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Generate or publish LeadPilot product-demo video
        run: node -e "console.log('Campaign:', process.env.LEADPILOT_CAMPAIGN_ID, 'Publish:', process.env.LEADPILOT_PUBLISH, 'Platforms:', process.env.LEADPILOT_PLATFORMS)" && npx ts-node --transpile-only scripts/leadpilot-product-video.ts

      - name: Upload generated LeadPilot video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leadpilot-${{ inputs.campaign }}-${{ github.run_number }}
          path: output/leadpilot/*.mp4
          if-no-files-found: warn
          retention-days: 14

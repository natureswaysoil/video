name: Google Sheet Row Social Video Posting

run-name: ${{ inputs.marketing_job_id && format('marketing-job:{0}', inputs.marketing_job_id) || 'Google Sheet Row Social Video Posting' }}

on:
  push:
    branches: [main]
    paths: ['config/marketing-rotation-go-live.json']
  workflow_call:
    inputs:
      marketing_job_id:
        required: false
        type: string
        default: ''
      marketing_campaign:
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      marketing_job_id:
        required: false
        type: string
        default: ''
      marketing_campaign:
        description: Base64url-encoded approved marketing campaign (normally supplied by marketing-agent)
        required: false
        type: string
  schedule:
    # GitHub cron is UTC and has no timezone/DST support. Trigger both
    # Eastern-time candidates; the gate below permits five daily posts at
    # 8 AM, 11 AM, 2 PM, 5 PM, and 8 PM ET throughout EST and EDT.
    - cron: '0 0 * * *'
    - cron: '0 1 * * *'
    - cron: '0 12 * * *'
    - cron: '0 13 * * *'
    - cron: '0 14 * * *'
    - cron: '0 15 * * *'
    - cron: '0 16 * * *'
    - cron: '0 18 * * *'
    - cron: '0 19 * * *'
    - cron: '0 21 * * *'
    - cron: '0 22 * * *'

concurrency:
  group: sheet-row-social-posting
  cancel-in-progress: false

jobs:
  schedule-gate:
    runs-on: ubuntu-24.04
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'push'
        with:
          lfs: false
      - name: Permit manual runs or five daily Eastern posting times
        id: gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python3 -c "import json; p=json.load(open('config/marketing-rotation-go-live.json')); assert p.get('enabled') is True and p.get('version') == 1 and p.get('featuredProductId') == 'NWS_012'"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Posting status: eligible (configuration change)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Posting status: eligible (manual or called workflow)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          eastern_hour="$(TZ=America/New_York date +%H)"
          case "$eastern_hour" in
            08|11|14|17|20) echo "should_run=true" >> "$GITHUB_OUTPUT"; echo "Posting window: ${eastern_hour}:00 Eastern" >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo "should_run=false" >> "$GITHUB_OUTPUT"; echo "### Skipped — outside posting window" >> "$GITHUB_STEP_SUMMARY"; echo "No post attempted at ${eastern_hour}:00 Eastern." >> "$GITHUB_STEP_SUMMARY" ;;
          esac

  post-sheet-row:
    needs: schedule-gate
    if: needs.schedule-gate.outputs.should_run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write

    env:
      USE_SECRET_MANAGER: 'true'
      DEFAULT_GOOGLE_CLOUD_PROJECT: natureswaysoil-video
      GOOGLE_CLOUD_PROJECT: natureswaysoil-video
      SHEET_CSV_URL: https://docs.google.com/spreadsheets/d/1dtUYrSy18_D2updwCpVa5wXfgf0hzAXaiQTQqMQnrSc/export?format=csv&gid=916620075
      SHEET_ROW_STATE_FILE: data/sheet-row-state.json
      # Core placements: YouTube Shorts, Instagram Reels, Facebook/Reels and groups.
      # TikTok and X are enabled too; their posting modules skip cleanly when
      # credentials are not configured rather than blocking the core platforms.
      ENABLE_PLATFORMS: youtube,instagram,facebook,facebook_groups,tiktok,twitter
      CI_MANDATORY_PLATFORMS: 'false'
      YT_PRIVACY_STATUS: public
      DRY_RUN_LOG_ONLY: 'false'
      FFMPEG_TIMEOUT_MS: '300000'
      GCS_PUBLIC_BUCKET: natureswaysoil-social-videos
      VIDEO_PUBLIC_BUCKET: natureswaysoil-social-videos
      VIDEO_PUBLIC_URL_BASE: https://storage.googleapis.com/natureswaysoil-social-videos
      MARKETING_JOB_ID: ${{ inputs.marketing_job_id }}
      MARKETING_RESULT_PATH: marketing-result.json
      MARKETING_CAMPAIGN_B64: ${{ inputs.marketing_campaign }}

      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Restore sheet row state
        uses: actions/cache/restore@v4
        with:
          path: data/sheet-row-state.json
          key: sheet-row-state-${{ github.run_id }}
          restore-keys: |
            sheet-row-state-

      - name: Authenticate to Google Cloud OIDC
        if: env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && env.GCP_SERVICE_ACCOUNT != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ env.DEFAULT_GOOGLE_CLOUD_PROJECT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Prepare Google ADC credentials
        if: env.GOOGLE_APPLICATION_CREDENTIALS == ''
        run: |
          set -euo pipefail
          CREDS_JSON="${GOOGLE_CREDENTIALS:-}"
          if [ -z "$CREDS_JSON" ]; then
            CREDS_JSON="${GOOGLE_SERVICE_ACCOUNT_JSON:-}"
          fi
          if [ -z "$CREDS_JSON" ]; then
            echo "::error::No Google auth configured. Add GCP OIDC secrets or GOOGLE_CREDENTIALS / GOOGLE_SERVICE_ACCOUNT_JSON."
            exit 1
          fi
          CREDS_PATH="$RUNNER_TEMP/gcp-service-account.json"
          printf '%s' "$CREDS_JSON" > "$CREDS_PATH"
          chmod 600 "$CREDS_PATH"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$CREDS_PATH" >> "$GITHUB_ENV"
          echo "GOOGLE_CLOUD_PROJECT=$DEFAULT_GOOGLE_CLOUD_PROJECT" >> "$GITHUB_ENV"
          echo "GCLOUD_PROJECT=$DEFAULT_GOOGLE_CLOUD_PROJECT" >> "$GITHUB_ENV"
          echo "GCP_PROJECT=$DEFAULT_GOOGLE_CLOUD_PROJECT" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          npm ci
          test -f node_modules/gaxios/build/cjs/src/index.js

      - name: Type-check production code
        run: npm run typecheck

      - name: Claim a queued or automatically rotated campaign
        if: inputs.marketing_campaign == ''
        run: python3 scripts/marketing-worker.py claim

      - name: Run approved product video
        id: marketing_post
        if: env.MARKETING_WORKER_CLAIMED == 'true' || inputs.marketing_campaign != ''
        run: npm run post:sheet-row

      - name: Report per-platform receipts
        if: always() && env.MARKETING_WORKER_CLAIMED == 'true'
        env:
          MARKETING_POST_OUTCOME: ${{ steps.marketing_post.outcome }}
        run: python3 scripts/marketing-worker.py report

      - name: Upload marketing channel receipt
        if: always() && env.MARKETING_JOB_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: marketing-result-${{ env.MARKETING_JOB_ID }}
          path: marketing-result.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Summarize publishing outcome
        if: always()
        env:
          POST_STEP_OUTCOME: ${{ steps.marketing_post.outcome }}
          CLAIMED: ${{ env.MARKETING_WORKER_CLAIMED }}
          CAMPAIGN_INPUT: ${{ inputs.marketing_campaign != '' }}
          RESULT_FILE: ${{ env.MARKETING_RESULT_PATH }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$POST_STEP_OUTCOME" = "failure" ]; then
            echo "### Publishing failed" >> "$GITHUB_STEP_SUMMARY"
            echo "The posting command failed. Review logs and platform receipts before retrying." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$POST_STEP_OUTCOME" = "skipped" ] && [ "$CLAIMED" != "true" ] && [ "$CAMPAIGN_INPUT" != "true" ]; then
            echo "### No campaign available" >> "$GITHUB_STEP_SUMMARY"
            echo "No approved or queued campaign was claimed, so no post was attempted." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$POST_STEP_OUTCOME" = "success" ]; then
            echo "### Posting command completed — publication unverified" >> "$GITHUB_STEP_SUMMARY"
            echo "The posting process returned success, but a successful command is not proof that any platform published a video." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Publishing not completed" >> "$GITHUB_STEP_SUMMARY"
            echo "Review previous steps for why posting did not execute." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f "${RESULT_FILE:-marketing-result.json}" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### Platform outcomes (receipt)" >> "$GITHUB_STEP_SUMMARY"
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json,os
          with open(os.environ.get('RESULT_FILE') or 'marketing-result.json',encoding='utf-8') as f:
              record=json.load(f)
          channels=record.get('channels',{}) if isinstance(record,dict) else {}
          if not isinstance(channels,dict): channels={}
          for platform,receipt in sorted(channels.items()):
              if not isinstance(receipt,dict): continue
              state=str(receipt.get('status') or ('posted' if receipt.get('success') is True else 'unverified')).lower()
              if state in ('posted','published','success','completed') and receipt.get('success') is not False:
                  result='Posted successfully'
              elif state in ('failed','error') or receipt.get('success') is False:
                  result='Publishing failed'
              else:
                  result='Not verified'
              print('- '+''.join(c for c in str(platform) if c.isalnum() or c in '-_')[:40]+': '+result)
          if not channels: print('No per-platform receipt entries were recorded.')
          PY
          else
            echo "No marketing-result.json receipt was generated. Platform success has not been verified." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Save sheet row state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/sheet-row-state.json
          key: sheet-row-state-${{ github.run_id }}

      - name: Upload sheet row state artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sheet-row-state
          path: data/sheet-row-state.json
          if-no-files-found: ignore

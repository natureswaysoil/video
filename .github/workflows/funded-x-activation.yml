name: Validate funded X publishing
on:
  pull_request:
    paths: ['src/x-funded-publisher.ts', 'src/x-posting-policy.ts', 'scripts/post-funded-x-video.ts', 'scripts/test-x-funded-publisher.ts', '.github/workflows/funded-x-activation.yml', 'config/x-paid-activation.json']
  push:
    branches: [main]
    paths: ['config/x-paid-activation.json']
permissions:
  contents: read
  id-token: write
concurrency:
  group: x-funded-validation-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx ts-node --type-check scripts/test-x-funded-publisher.ts
      - run: npx ts-node --type-check scripts/post-funded-x-video.ts
        env:
          X_SETUP_VALIDATE_ONLY: 'true'
  post-x:
    needs: validate
    if: github.repository == 'natureswaysoil/video' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      X_PAID_POSTING_ENABLED: 'true'
      GOOGLE_CLOUD_PROJECT: natureswaysoil-video
      DEFAULT_GOOGLE_CLOUD_PROJECT: natureswaysoil-video
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Authenticate to Google Cloud OIDC
        if: env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && env.GCP_SERVICE_ACCOUNT != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ env.DEFAULT_GOOGLE_CLOUD_PROJECT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Prepare Google ADC credentials
        if: env.GOOGLE_APPLICATION_CREDENTIALS == ''
        run: |
          set -euo pipefail
          CREDS_JSON="${GOOGLE_CREDENTIALS:-}"
          if [ -z "$CREDS_JSON" ]; then
            CREDS_JSON="${GOOGLE_SERVICE_ACCOUNT_JSON:-}"
          fi
          if [ -z "$CREDS_JSON" ]; then
            echo "::error::No Google auth configured. Add GCP OIDC secrets or GOOGLE_CREDENTIALS / GOOGLE_SERVICE_ACCOUNT_JSON."
            exit 1
          fi
          CREDS_PATH="$RUNNER_TEMP/gcp-service-account.json"
          printf '%s' "$CREDS_JSON" > "$CREDS_PATH"
          chmod 600 "$CREDS_PATH"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$CREDS_PATH" >> "$GITHUB_ENV"
          echo "GOOGLE_CLOUD_PROJECT=$DEFAULT_GOOGLE_CLOUD_PROJECT" >> "$GITHUB_ENV"
          echo "GCLOUD_PROJECT=$DEFAULT_GOOGLE_CLOUD_PROJECT" >> "$GITHUB_ENV"
          echo "GCP_PROJECT=$DEFAULT_GOOGLE_CLOUD_PROJECT" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          npm ci
          test -f node_modules/gaxios/build/cjs/src/index.js

      - name: Type-check production code
        run: npm run typecheck



      - name: Verify funded app and publish one X video
        run: npx ts-node --type-check scripts/post-funded-x-video.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: x-funded-post-result
          path: x-funded-post-result.json
          if-no-files-found: ignore
          retention-days: 90

name: Marketing contract checks
on:
  pull_request:
    paths: ['src/x-funded-publisher.ts', 'scripts/test-x-funded-publisher.ts', 'scripts/post-funded-x-video.ts', '.github/workflows/funded-x-activation.yml', 'config/x-paid-activation.json', 'src/x-posting-policy.ts', 'src/twitter.ts', 'scripts/lib/social-platforms.ts', 'scripts/test-x-manual-posting.ts', 'scripts/lib/marketing-*.ts', 'scripts/test-marketing-*.ts', 'scripts/post-sheet-row.ts', 'scripts/post-scheduled.ts', 'scripts/marketing-worker.py', 'scripts/test-automatic-marketing.ts', 'scripts/lib/product-assets.ts', '.github/workflows/marketing-contract-ci.yml', '.github/workflows/sheet-row-posting.yml']
permissions:
  contents: read
jobs:
  offline-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npx ts-node --type-check scripts/test-x-funded-publisher.ts
      - run: npx ts-node --type-check scripts/test-x-manual-posting.ts
      - run: npx ts-node scripts/test-marketing-receipt.ts
      - run: npm run test:marketing-campaign
      - run: npx ts-node --transpile-only scripts/test-automatic-marketing.ts
      - run: python3 -m py_compile scripts/marketing-worker.py
      - run: python3 -m unittest scripts/test_marketing_worker.py
      - run: npm run test:product-assets

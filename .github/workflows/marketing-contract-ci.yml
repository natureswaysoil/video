name: Marketing contract checks
on:
  pull_request:
    paths: ['scripts/lib/marketing-*.ts', 'scripts/test-marketing-*.ts', 'scripts/post-sheet-row.ts', 'scripts/post-scheduled.ts', '.github/workflows/marketing-contract-ci.yml', '.github/workflows/sheet-row-posting.yml']
permissions:
  contents: read
jobs:
  offline-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npx ts-node scripts/test-marketing-receipt.ts
      - run: npm run test:marketing-campaign
